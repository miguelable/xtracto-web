# Revisa automáticamente cada formato que llega y avisa si se ha colado un dato personal.
#
# El motivo de que esto exista: pedimos plantillas, no gastos. Si alguien pega el aviso en crudo,
# su importe y sus dígitos de tarjeta quedarían públicos en un issue. El robot no puede impedirlo,
# pero lo detecta al instante, lo etiqueta y le pide a la persona que lo edite.
name: Revisar formato enviado

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  revisar:
    if: contains(github.event.issue.labels.*.name, 'formato')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const cuerpo = context.payload.issue.body || '';

            // Solo se mira la sección de la plantilla: el nombre del paquete puede llevar cifras
            // legítimas (com.app2), y la fecha de apertura del issue no es cosa nuestra.
            const bloque = cuerpo.split(/###\s*Plantilla del aviso/i)[1] || '';
            const plantilla = bloque.split(/###/)[0] || '';
            const cifras = plantilla.match(/\d/g) || [];

            const etiquetar = async (nombre, color, descripcion) => {
              try {
                await github.rest.issues.createLabel({
                  ...context.repo, name: nombre, color, description: descripcion,
                });
              } catch (e) { /* ya existía */ }
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: context.issue.number, labels: [nombre],
              });
            };

            if (cifras.length > 0) {
              await etiquetar('revisar-datos', 'd93f0b', 'Puede contener datos personales');
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: [
                  '⚠️ **He detectado ' + cifras.length + ' cifra(s) en la plantilla.**',
                  '',
                  'Puede que sean parte del formato, pero también puede que se haya colado un',
                  'importe, una fecha o unos dígitos de tarjeta. **Edita el mensaje y sustitúyelos**',
                  'por marcadores (`<importe>`, `<fecha>`, `<tarjeta>`): para añadir tu banco no',
                  'hace falta ni un número real.',
                  '',
                  'Al guardar la edición vuelvo a revisarlo.',
                  '',
                  '_Este aviso es automático._',
                ].join('\n'),
              });
              return;
            }

            await etiquetar('formato-limpio', '0e8a16', 'Revisado: sin datos personales');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                '✅ **Plantilla recibida y sin ninguna cifra.** Gracias.',
                '',
                'Pasará a la lista de formatos por añadir al parser. Cuando esté soportado, te aviso',
                'por aquí y podrás recuperar los avisos que ya tengas guardados con el botón',
                '**Reprocesar** de la pantalla de Ajustes de la app.',
                '',
                '_Este aviso es automático._',
              ].join('\n'),
            });
